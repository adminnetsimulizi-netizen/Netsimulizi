<script>
async function loadChapters(storyId){

    const section = document.getElementById("chaptersSection");
    const list = document.getElementById("chapterList");
    const count = document.getElementById("chapterCount");

    try{

        const response = await fetch(
            API_BASE +
            "/stories/" +
            encodeURIComponent(storyId) +
            "/episodes",
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const text = await response.text();

        let data;

        try{
            data = JSON.parse(text);
        }catch{
            throw new Error(
                "Server imerudisha response isiyo sahihi. HTTP " +
                response.status
            );
        }

        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Imeshindikana kupata episodes. HTTP " +
                response.status
            );

        }

        const chapters =
            Array.isArray(data.episodes)
                ? data.episodes
                : Array.isArray(data.chapters)
                    ? data.chapters
                    : [];

        section.classList.remove("hidden");

        count.textContent =
            chapters.length + " chapters";

        if(!chapters.length){

            list.innerHTML = `
                <div class="empty">
                    Hakuna chapters zilizowekwa bado.
                </div>
            `;

            return;
        }

        list.innerHTML = "";

        chapters.forEach(function(chapter,index){

            const chapterId = chapter.id;

            const number =
                chapter.chapter_number ??
                chapter.episode_number ??
                chapter.number ??
                index + 1;

            const title =
                chapter.title ||
                "Chapter " + number;

            const locked =
                chapter.is_locked === true ||
                chapter.is_locked === 1 ||
                chapter.locked === true;

            const item =
                document.createElement("div");

            item.className = "chapter";

            item.innerHTML = `

                <div class="chapter-left">

                    <div class="chapter-number">
                        ${escapeHTML(number)}
                    </div>

                    <div>

                        <div class="chapter-title">
                            ${escapeHTML(title)}
                        </div>

                        <div class="chapter-date">
                            ${formatDate(
                                chapter.created_at ||
                                chapter.published_at
                            )}
                        </div>

                    </div>

                </div>

                ${
                    locked

                    ?

                    `<span class="locked">
                        🔒 Locked
                    </span>`

                    :

                    `<button
                        class="chapter-button"
                        onclick="openChapter(
                            ${Number(chapterId)},
                            ${Number(storyId)}
                        )"
                    >
                        Read
                    </button>`
                }

            `;

            list.appendChild(item);

        });

    }catch(error){

        console.error(
            "Episodes error:",
            error
        );

        section.classList.remove("hidden");

        list.innerHTML = `

            <div class="error">

                Imeshindikana kupakia chapters.

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Kuna tatizo kwenye API."
                )}

                <br><br>

                <button
                    class="btn primary"
                    onclick="loadChapters(${Number(storyId)})"
                >
                    Jaribu Tena
                </button>

            </div>

        `;

    }

}
</script>
