<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Author Dashboard - Net Simulizi</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f1e5;
    color:#2d241b;
    min-height:100vh;
}

body.dark{
    background:#17130f;
    color:#f5ead8;
}

a{
    text-decoration:none;
    color:inherit;
}

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    width:100%;
    background:#fffaf0;
    border-bottom:1px solid #e5d7c0;
    padding:14px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.dark .topbar{
    background:#211b16;
    border-color:#3b3025;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:700;
}

.logo{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#8b5e34;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:700;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
}

.btn-light{
    background:#eadcc7;
    color:#35291d;
}

.dark .btn-light{
    background:#382d23;
    color:#f5ead8;
}

.btn-primary{
    background:#8b5e34;
    color:#fff;
}

.container{
    width:min(1150px,92%);
    margin:0 auto;
}

.hero{
    margin:35px 0 25px;
    padding:30px;
    border-radius:18px;
    background:#fffaf0;
    border:1px solid #eadcc7;
}

.dark .hero{
    background:#211b16;
    border-color:#3b3025;
}

.hero h1{
    font-size:30px;
    margin-bottom:8px;
}

.hero p{
    color:#786653;
    line-height:1.6;
}

.dark .hero p{
    color:#c8b9a6;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#fffaf0;
    border:1px solid #eadcc7;
    border-radius:14px;
    padding:20px;
}

.dark .stat{
    background:#211b16;
    border-color:#3b3025;
}

.stat span{
    display:block;
    font-size:13px;
    color:#806d59;
    margin-bottom:8px;
}

.dark .stat span{
    color:#bcae9c;
}

.stat strong{
    font-size:27px;
}

.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:13px 15px;
    border-radius:10px;
    border:1px solid #ddcdb7;
    background:#fffaf0;
    color:#2d241b;
    outline:none;
}

.dark .search input{
    background:#211b16;
    border-color:#3b3025;
    color:#fff;
}

.stories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-bottom:40px;
}

.story-card{
    background:#fffaf0;
    border:1px solid #eadcc7;
    border-radius:16px;
    padding:20px;
}

.dark .story-card{
    background:#211b16;
    border-color:#3b3025;
}

.story-card h3{
    font-size:20px;
    margin-bottom:8px;
}

.story-card p{
    color:#786653;
    line-height:1.5;
    margin-bottom:12px;
}

.dark .story-card p{
    color:#c8b9a6;
}

.story-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    background:#eadcc7;
}

.dark .badge{
    background:#382d23;
}

.status-approved{
    background:#dcefdc;
    color:#245b29;
}

.status-pending{
    background:#f5e7bd;
    color:#76570a;
}

.status-completed{
    background:#dce7f4;
    color:#254d75;
}

.status-other{
    background:#eadcc7;
}

.story-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    background:#fffaf0;
    border:1px dashed #d8c6ad;
    border-radius:16px;
    color:#806d59;
}

.dark .empty{
    background:#211b16;
    border-color:#4b3d30;
    color:#bcae9c;
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
}

footer{
    border-top:1px solid #e5d7c0;
    padding:25px 5%;
    text-align:center;
    color:#806d59;
    margin-top:20px;
}

.dark footer{
    border-color:#3b3025;
    color:#bcae9c;
}

@media(max-width:800px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stories{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }
}

@media(max-width:500px){
    .topbar{
        padding:12px 4%;
    }

    .brand{
        font-size:17px;
    }

    .logo{
        width:34px;
        height:34px;
    }

    .hero{
        padding:22px;
    }

    .hero h1{
        font-size:25px;
    }

    .stats{
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat strong{
        font-size:23px;
    }

    .top-actions .btn{
        padding:8px 10px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <a href="author-dashboard.html" class="brand">
        <div class="logo">NS</div>
        <span>Net Simulizi</span>
    </a>

    <div class="top-actions">
        <button class="btn btn-light" id="themeBtn">🌙</button>
        <a href="author-dashboard.html" class="btn btn-light">Dashboard</a>
        <button class="btn btn-light" id="logoutBtn">Logout</button>
    </div>
</header>

<main class="container">

    <section class="hero">
        <h1>My Stories</h1>
        <p>
            Karibu kwenye Author Dashboard. Hapa unaweza kuona na kusimamia
            hadithi zako kwenye Net Simulizi.
        </p>
    </section>

    <section class="stats">
        <div class="stat">
            <span>Total Stories</span>
            <strong id="totalStories">0</strong>
        </div>

        <div class="stat">
            <span>Approved</span>
            <strong id="approvedStories">0</strong>
        </div>

        <div class="stat">
            <span>Pending</span>
            <strong id="pendingStories">0</strong>
        </div>

        <div class="stat">
            <span>Completed</span>
            <strong id="completedStories">0</strong>
        </div>
    </section>

    <section class="toolbar">
        <div class="search">
            <input
                type="search"
                id="searchInput"
                placeholder="Search your stories..."
            >
        </div>

        <a href="author-submit.html" class="btn btn-primary">
            + Submit Story
        </a>
    </section>

    <section class="stories" id="storiesList">
        <div class="loading">Loading stories...</div>
    </section>

</main>

<footer>
    © 2026 Net Simulizi. All rights reserved.
</footer>

<script>
const API = "https://netsimulizi.pages.dev/api";

const author = JSON.parse(
    localStorage.getItem("netsimulizi_author") || "null"
);

if (!author || !author.id) {
    window.location.href = "author-login.html";
}

let allStories = [];

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function getStatusClass(status){
    const value = String(status || "").toLowerCase();

    if(value === "approved" || value === "published"){
        return "status-approved";
    }

    if(value === "pending"){
        return "status-pending";
    }

    if(value === "completed"){
        return "status-completed";
    }

    return "status-other";
}

function getStatusLabel(status){
    const value = String(status || "").toLowerCase();

    if(value === "published"){
        return "Approved";
    }

    if(value === "approved"){
        return "Approved";
    }

    if(value === "pending"){
        return "Pending";
    }

    if(value === "completed"){
        return "Completed";
    }

    return status || "Unknown";
}

function belongsToAuthor(story){
    return Number(story.author_id) === Number(author.id);
}

function updateStats(stories){

    const total = stories.length;

    const approved = stories.filter(story => {
        const status = String(story.status || "").toLowerCase();
        return status === "approved" || status === "published";
    }).length;

    const pending = stories.filter(story => {
        return String(story.status || "").toLowerCase() === "pending";
    }).length;

    const completed = stories.filter(story => {
        return String(story.status || "").toLowerCase() === "completed";
    }).length;

    document.getElementById("totalStories").textContent = total;
    document.getElementById("approvedStories").textContent = approved;
    document.getElementById("pendingStories").textContent = pending;
    document.getElementById("completedStories").textContent = completed;
}

function renderStories(stories){

    const list = document.getElementById("storiesList");

    updateStats(stories);

    if(!stories.length){
        list.innerHTML = `
            <div class="empty">
                <h3>No stories found</h3>
                <p>You have not submitted any stories yet.</p>
            </div>
        `;
        return;
    }

    list.innerHTML = stories.map(story => {

        const title = escapeHTML(
            story.title || "Untitled Story"
        );

        const description = escapeHTML(
            story.description || "No description available."
        );

        const category = escapeHTML(
            story.category_name ||
            story.category ||
            story.category_slug ||
            "Uncategorized"
        );

        const status = getStatusLabel(story.status);
        const statusClass = getStatusClass(story.status);

        return `
            <article class="story-card">

                <h3>${title}</h3>

                <p>${description}</p>

                <div class="story-meta">
                    <span class="badge">${category}</span>
                    <span class="badge ${statusClass}">
                        ${escapeHTML(status)}
                    </span>
                </div>

                <div class="story-actions">
                    <a
                        href="story.html?id=${encodeURIComponent(story.id)}"
                        class="btn btn-light"
                    >
                        View
                    </a>

                    <a
                        href="author-story.html?id=${encodeURIComponent(story.id)}"
                        class="btn btn-primary"
                    >
                        Manage
                    </a>
                </div>

            </article>
        `;

    }).join("");
}

async function loadStories(){

    const list = document.getElementById("storiesList");

    try{

        const response = await fetch(
            `${API}/author/stories/${author.id}`
        );

        const data = await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.message || "Failed to load stories"
            );
        }

        const stories = Array.isArray(data.stories)
            ? data.stories
            : [];

        allStories = stories;

        renderStories(allStories);

    }catch(error){

        console.error("Author stories error:", error);

        list.innerHTML = `
            <div class="empty">
                <h3>Unable to load stories</h3>
                <p>Please try again.</p>
            </div>
        `;
    }
}


document.getElementById("searchInput")
    .addEventListener("input", function(){

        const query = this.value
            .trim()
            .toLowerCase();

        if(!query){
            renderStories(allStories);
            return;
        }

        const filtered = allStories.filter(story => {

            const title = String(
                story.title || ""
            ).toLowerCase();

            const description = String(
                story.description || ""
            ).toLowerCase();

            const category = String(
                story.category_name ||
                story.category ||
                story.category_slug ||
                ""
            ).toLowerCase();

            return (
                title.includes(query) ||
                description.includes(query) ||
                category.includes(query)
            );
        });

        renderStories(filtered);
    });

document.getElementById("logoutBtn")
    .addEventListener("click", function(){

        localStorage.removeItem("netsimulizi_author");

        window.location.href = "author-login.html";
    });

const themeBtn = document.getElementById("themeBtn");

const savedTheme =
    localStorage.getItem("netsimulizi_author_theme");

if(savedTheme === "dark"){
    document.body.classList.add("dark");
    themeBtn.textContent = "☀️";
}

themeBtn.addEventListener("click", function(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "netsimulizi_author_theme",
        dark ? "dark" : "light"
    );

    themeBtn.textContent = dark ? "☀️" : "🌙";
});

loadStories();
</script>

</body>
</html>
