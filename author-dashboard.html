<header class="top">

<main class="wrap">


  <section class="hero">

    <h1>
      My Stories
    </h1>

    <p class="muted">
      Simamia hadithi zako, angalia status zake
      na endelea kuongeza episodes.
    </p>

  </section>


  <section class="stats">

    <div class="stat">
      <div
        class="stat-number"
        id="totalStories"
      >
        0
      </div>

      </div>

    <div class="stat">
      <div
        class="stat-number"

      >

  </p>

</footer>


<script>


/* =========================
   DARK MODE
========================= */

const darkBtn =
  document.getElementById("darkBtn");


if(
  localStorage.getItem("netsimulizi_dark") === "1"
){

  document.body.classList.add("dark");

}


darkBtn.addEventListener(
  "click",
  function(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
      "netsimulizi_dark",
      document.body.classList.contains("dark")
        ? "1"
        : "0"
    );

  }
);


/* =========================
   USER
========================= */

let user = null;


try{

  user =
    JSON.parse(
      localStorage.getItem("netsimulizi_user")
    );

}catch(error){

  user = null;

}


if(!user){

  window.location.href =
    "author-login.html";

}


const role =
  String(user?.role || "")
    .trim()
    .toLowerCase();


if(
  user &&
  role !== "author" &&
  role !== "admin"
){

  localStorage.removeItem(
    "netsimulizi_user"
  );

  window.location.href =
    "author-login.html";

}


/* =========================
   ELEMENTS
========================= */

const storyList =
  document.getElementById("storyList");

const searchInput =
  document.getElementById("searchInput");

const errorBox =
  document.getElementById("errorBox");

let allStories = [];


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   STATUS
========================= */

function getStatus(story){

  const status =
    String(
      story.status ||
      story.approval_status ||
      story.publish_status ||
      ""
    ).toLowerCase();

  if(
    status === "approved" ||
    status === "published"
  ){

    return {
      text:"Approved",
      className:"approved"
    };

  }

  if(
    status === "rejected"
  ){

    return {
      text:"Rejected",
      className:"rejected"
    };

  }

  if(
    status === "completed"
  ){

    return {
      text:"Completed",
      className:"completed"
    };

  }

  if(
    status === "ongoing"
  ){

    return {
      text:"Ongoing",
      className:"ongoing"
    };

  }

  return {
    text:"Pending",
    className:"pending"
  };

}


/* =========================
   COVER
========================= */

function getCover(story){

  const cover =
    story.cover_url ||
    story.cover ||
    story.image ||
    story.cover_image ||
    "";

  if(cover){

    return `
      <img
        src="${escapeHTML(cover)}"
        alt="${escapeHTML(story.title || "Story")}"
        onerror="this.remove()"
      >
    `;

  }

  return `
    <span>
      ${escapeHTML(story.title || "STORY")}
    </span>
  `;

}


/* =========================
   FILTER AUTHOR STORIES
========================= */

function belongsToAuthor(story){

  if(role === "admin"){

    return true;

  }


  const authorId =
    story.author_id ??
    story.authorId ??
    story.user_id ??
    story.userId;


  const currentId =
    user.id ??
    user.user_id;


  if(
    authorId !== undefined &&
    authorId !== null &&
    currentId !== undefined &&
    currentId !== null
  ){

    return String(authorId) ===
      String(currentId);

  }


  const authorName =
    String(
      story.author_name ||
      story.author ||
      story.author_username ||
      ""
    ).trim().toLowerCase();


  const currentName =
    String(
      user.name ||
      user.username ||
      ""
    ).trim().toLowerCase();


  if(
    authorName &&
    currentName
  ){

    return authorName === currentName;

  }


  /*
   * Kwa sasa API ya /api/stories inaweza
   * kurudisha stories ambazo hazina author_id.
   *
   * Kwa admin tunaonyesha zote.
   * Kwa author tunatumia jina la author ikiwa lipo.
   */

  return false;

}


/* =========================
   RENDER
========================= */

function renderStories(list){

  if(!list.length){

    storyList.innerHTML = `

      <div class="empty">

        <h2>
          Hakuna stories
        </h2>

        <p class="muted">
          Bado huna hadithi zilizopatikana
          kwenye account yako.
        </p>

        <a
          href="submit-story.html"
          class="btn primary"
        >
          + Submit Story
        </a>

      </div>

    `;

    return;

  }


  storyList.innerHTML =
    list.map(function(story){

      const status =
        getStatus(story);

      const title =
        story.title ||
        "Untitled Story";

      const description =
        story.description ||
        story.summary ||
        "Hakuna maelezo ya hadithi.";

      const language =
        story.language ||
        "—";

      const category =
        story.category ||
        "—";

      const id =
        story.id ||
        story.story_id;


      return `

        <article class="story-card">


          <div class="cover">

            ${getCover(story)}

          </div>


          <div>

            <h2 class="story-title">
              ${escapeHTML(title)}
            </h2>


            <p class="description">
              ${escapeHTML(description)}
            </p>


            <div class="meta">

              <span class="badge">
                ${escapeHTML(category)}
              </span>

              <span class="badge">
                ${escapeHTML(language)}
              </span>

              <span class="status ${status.className}">
                ${status.text}
              </span>

            </div>

          </div>


          <div class="actions">

            ${
              id
              ?
              `
              <a
                href="story.html?id=${encodeURIComponent(id)}"
                class="btn"
              >
                View Story
              </a>

              <a
                href="chapters.html?id=${encodeURIComponent(id)}"
                class="btn primary"
              >
                Episodes
              </a>
              `
              :
              `
              <span class="btn">
                No ID
              </span>
              `
            }

          </div>


        </article>

      `;

    }).join("");

}


/* =========================
   STATS
========================= */

function updateStats(list){

  document.getElementById(
    "totalStories"
  ).textContent =
    list.length;


  document.getElementById(
    "approvedStories"
  ).textContent =
    list.filter(function(story){

      const status =
        String(
          story.status ||
          story.approval_status ||
          story.publish_status ||
          ""
        ).toLowerCase();

      return (
        status === "approved" ||
        status === "published"
      );

    }).length;


  document.getElementById(
    "pendingStories"
  ).textContent =
    list.filter(function(story){

      const status =
        String(
          story.status ||
          story.approval_status ||
          story.publish_status ||
          ""
        ).toLowerCase();

      return (
        !status ||
        status === "pending"
      );

    }).length;


  document.getElementById(
    "completedStories"
  ).textContent =
    list.filter(function(story){

      return String(
        story.status || ""
      ).toLowerCase() === "completed";

    }).length;

}


/* =========================
   LOAD STORIES
========================= */

async function loadStories(){

  try{

    errorBox.style.display =
      "none";


    const response =
      await fetch("/api/stories");


    if(!response.ok){

      throw new Error(
        "Imeshindikana kupata stories."
      );

    }


    const data =
      await response.json();


    if(Array.isArray(data)){

      allStories = data;

    }else if(
      Array.isArray(data.stories)
    ){

      allStories =
        data.stories;

    }else{

      allStories = [];

    }


    /*
     * Kwa admin tunaonyesha stories zote.
     *
     * Kwa author tunajaribu kuchuja
     * kwa author_id au author name.
     */

    let authorStories =
      allStories.filter(
        belongsToAuthor
      );


    /*
     * Kama API ya sasa haina author
     * information kabisa, hakuna story
     * inayoweza kuthibitishwa kuwa ni ya
     * author huyu.
     */

    updateStats(
      authorStories
    );

    renderStories(
      authorStories
    );


    searchInput.addEventListener(
      "input",
      function(){

        const term =
          this.value
            .trim()
            .toLowerCase();


        const filtered =
          authorStories.filter(
            function(story){

              const title =
                String(
                  story.title || ""
                ).toLowerCase();

              const description =
                String(
                  story.description ||
                  story.summary ||
                  ""
                ).toLowerCase();

              const category =
                String(
                  story.category || ""
                ).toLowerCase();


              return (
                title.includes(term) ||
                description.includes(term) ||
                category.includes(term)
              );

            }
          );


        renderStories(
          filtered
        );

      }
    );


  }catch(error){

    console.error(
      "My Stories error:",
      error
    );


    storyList.innerHTML =
      "";


    errorBox.style.display =
      "block";

    errorBox.className =
      "error";

    errorBox.textContent =
      error.message ||
      "Imeshindikana kupakia stories.";

  }

}


loadStories();


</script>

</body>

</html>
```
