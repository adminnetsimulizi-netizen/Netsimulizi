<section class="card">

    <div class="logo-box">

            src="Logo.png"

    <h1>Ingia</h1>

    <p class="subtitle">

    <form id="loginForm">

        <div class="form-group">

            <label for="login">
                Username au Email
            </label>

            <input
                id="login"
                name="login"
                type="text"
                placeholder="Username au email"
                required
                autocomplete="username">

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Weka password yako"
                required
                autocomplete="current-password">

        </div>


        <button
            id="loginButton"
            class="btn primary"
            type="submit">

            Ingia

        </button>


        <div
            id="loginMessage"
            class="message">
        </div>

    </form>


    <div class="register-link">

        Huna akaunti?

<script>

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const login =
            document
                .getElementById("login")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginMessage.className =
            "message show";

        loginMessage.textContent =
            "Inaingia...";


        loginButton.disabled = true;


        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                login: login,
                                password: password
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                loginMessage.textContent =
                    data.message ||
                    "Login imeshindikana.";

                loginButton.disabled =
                    false;

                return;
            }


            loginMessage.textContent =
                "Umefanikiwa kuingia.";


            /*
             * Hifadhi taarifa za user kwa
             * matumizi ya hatua zinazofuata.
             */

            if (data.user) {

                localStorage.setItem(
                    "netsimulizi_user",
                    JSON.stringify(data.user)
                );

            }


            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                1000
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            loginMessage.textContent =
                "Imeshindikana kuwasiliana na Net Simulizi API.";


            loginButton.disabled =
                false;
        }

    }
);

</script>
