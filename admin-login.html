<body>


<header class="top">

  <a
    class="logo-link"
    href="index.html"
  >

    <img
      src="Logo.png"
      alt="Net Simulizi Logo"
      class="top-logo"
    >

  </a>


  <div class="top-actions">

    <button
      class="btn"
      id="themeBtn"
      type="button"
    >
      ◐
    </button>


    <button
      class="btn"
      type="button"
      onclick="location.href='index.html'"
    >
      Website
    </button>

  </div>

</header>


<main class="wrap">

  <section class="card">

    <div class="card-header">

      <div class="admin-icon">
        🔐
      </div>

      <h1>
        Admin Login
      </h1>

      <p class="muted">
        Authorized administrators only.
      </p>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <form
      id="adminLoginForm"
      class="form"
    >

      <label for="login">
        Email / Username
      </label>


      <input
        id="login"
        name="login"
        type="text"
        autocomplete="username"
        placeholder="Ingiza email au username"
        required
      >


      <label for="password">
        Password
      </label>


      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Ingiza password"
        required
      >


      <button
        id="loginBtn"
        class="btn primary login-btn"
        type="submit"
      >
        Login
      </button>

    </form>


    <div class="security-note">

      🔒 Ukurasa huu ni wa wasimamizi wa Net Simulizi pekee.
      <br>
      Account lazima iwe na role ya <b>admin</b> ili kuingia kwenye Admin Dashboard.

    </div>


    <a
      href="index.html"
      class="back"
    >
      ← Rudi kwenye Net Simulizi
    </a>

  </section>

</main>


<footer class="footer">

  <img
    src="Logo.png"
    alt="Net Simulizi Logo"
    class="footer-logo"
  >

  <p>
    Digital Storytelling Platform
  </p>

  <p>
    © 2026 Net Simulizi
  </p>

</footer>


<script>

  /*
   * API
   */

 const API = "https://netsimulizi.pages.dev/api";

  /*
   * THEME
   */

  const themeBtn =
    document.getElementById(
      "themeBtn"
    );


  const savedTheme =
    localStorage.getItem(
      "netsimulizi_theme"
    );


  if(savedTheme === "light"){

    document.body.classList.remove(
      "dark"
    );

  }else{

    document.body.classList.add(
      "dark"
    );

  }


  themeBtn.addEventListener(
    "click",
    function(){

      document.body.classList.toggle(
        "dark"
      );


      if(
        document.body.classList.contains(
          "dark"
        )
      ){

        localStorage.removeItem(
          "netsimulizi_theme"
        );

      }else{

        localStorage.setItem(
          "netsimulizi_theme",
          "light"
        );

      }

    }
  );


  /*
   * MESSAGE
   */

  function showMessage(
    text,
    type
  ){

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.className =
      "message " + type;

  }


  /*
   * ADMIN LOGIN
   */

  document
    .getElementById(
      "adminLoginForm"
    )
    .addEventListener(
      "submit",
      async function(event){

        event.preventDefault();


        const login =
          document
            .getElementById("login")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const button =
          document.getElementById(
            "loginBtn"
          );


        if(!login || !password){

          showMessage(
            "Tafadhali jaza username/email na password.",
            "error"
          );

          return;

        }


        button.textContent =
          "Inaingia...";


        button.classList.add(
          "loading"
        );


        try{

          const response =
            await fetch(
              `${API}/login`,
              {
                method:"POST",

                headers:{
                  "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                  login:login,

                  email:login,

                  username:login,

                  password:password

                })

              }
            );


          let data = {};


          try{

            data =
              await response.json();

          }catch(error){

            data = {};

          }


          /*
           * API ERROR
           */

          if(!response.ok){

            showMessage(
              data.error ||
              data.message ||
              `Login API error: HTTP ${response.status}`,
              "error"
            );

            button.textContent =
              "Login";

            button.classList.remove(
              "loading"
            );

            return;

          }


          /*
           * BACKEND USER
           */

          const user =
            data.user ||
            data;


          /*
           * ADMIN CHECK
           */

          const role =
            String(
              user.role ||
              ""
            ).toLowerCase();


          if(role !== "admin"){

            showMessage(
              "Account hii si ya Admin. Huwezi kuingia kwenye Admin Dashboard.",
              "error"
            );


            button.textContent =
              "Login";


            button.classList.remove(
              "loading"
            );


            return;

          }


          /*
           * SAVE SESSION
           */

          localStorage.setItem(
            "netsimulizi_user",
            JSON.stringify(user)
          );


          /*
           * SUCCESS
           */

          showMessage(
            "Login imefanikiwa. Inaelekeza kwenye Admin Dashboard...",
            "success"
          );


          setTimeout(
            function(){

              window.location.href =
                "admin-dashboard.html";

            },
            700
          );


        }catch(error){

          console.error(
            "Admin login error:",
            error
          );


          showMessage(
            `Login API connection error: ${
              error.message ||
              "Haikuweza kuwasiliana na server."
            }`,
            "error"
          );


          button.textContent =
            "Login";


          button.classList.remove(
            "loading"
          );

        }

      }
    );

</script>


</body>
</html>
