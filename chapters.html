<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapters - Net Simulizi</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#090b10;
--surface:#11141b;
--surface-2:#171b24;
--gold:#e5a51c;
--gold-light:#f2bd3d;
--text:#fff;
--muted:#a8afbd;
--border:rgba(255,255,255,.09);
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.5;
min-height:100vh;
}

a{
text-decoration:none;
color:inherit;
}

button,
input{
font:inherit;
}

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(9,11,16,.97);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
}

.header-inner{
max-width:1200px;
margin:auto;
padding:14px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
color:var(--gold);
font-weight:900;
letter-spacing:2px;
font-size:19px;
}

.header-right{
display:flex;
align-items:center;
gap:8px;
}

.btn{
padding:10px 14px;
border-radius:8px;
border:1px solid var(--border);
background:var(--surface);
color:white;
cursor:pointer;
font-weight:700;
}

.btn:hover{
border-color:var(--gold);
color:var(--gold);
}

.primary{
background:var(--gold);
color:#111;
border-color:var(--gold);
}

.primary:hover{
background:var(--gold-light);
color:#111;
}

.wrap{
max-width:1000px;
margin:auto;
padding:35px 20px 70px;
}

.story-header{
background:
radial-gradient(
circle at 85% 20%,
rgba(229,165,28,.13),
transparent 30%
),
var(--surface);

border:1px solid var(--border);
border-radius:16px;
padding:30px;
margin-bottom:25px;
}

.back{
display:inline-block;
color:var(--gold);
font-size:14px;
font-weight:700;
margin-bottom:20px;
}

.story-header h1{
font-size:clamp(28px,5vw,44px);
margin-bottom:8px;
}

.author{
color:var(--muted);
margin-bottom:18px;
}

.story-description{
color:#c4c9d3;
max-width:760px;
}

.stats{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:20px;
}

.stat{
padding:8px 13px;
border:1px solid var(--border);
border-radius:20px;
font-size:13px;
color:#c9ced8;
}

.section{
background:var(--surface);
border:1px solid var(--border);
border-radius:16px;
overflow:hidden;
}

.section-header{
padding:20px 22px;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.section-header h2{
font-size:22px;
}

.chapter-count{
font-size:13px;
color:var(--muted);
}

.chapter-list{
display:flex;
flex-direction:column;
}

.chapter{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding:18px 22px;
border-bottom:1px solid var(--border);
transition:.2s;
}

.chapter:last-child{
border-bottom:0;
}

.chapter:hover{
background:var(--surface-2);
}

.chapter-info{
display:flex;
align-items:center;
gap:15px;
min-width:0;
}

.chapter-number{
width:42px;
height:42px;
border-radius:9px;
background:#20242d;
display:flex;
align-items:center;
justify-content:center;
color:var(--gold);
font-weight:900;
flex-shrink:0;
}

.chapter-details{
min-width:0;
}

.chapter-title{
font-weight:800;
margin-bottom:3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.chapter-meta{
font-size:12px;
color:var(--muted);
}

.chapter-action{
flex-shrink:0;
}

.loading,
.empty,
.error{
padding:45px 20px;
text-align:center;
color:var(--muted);
}

.error{
color:#ff9c9c;
}

.retry{
margin-top:15px;
}

.footer{
background:#07090d;
border-top:1px solid var(--border);
padding:35px 20px;
text-align:center;
color:#777f8d;
}

.footer .logo{
display:block;
margin-bottom:8px;
}

@media(max-width:700px){

.header-inner{
padding:12px 14px;
}

.wrap{
padding:20px 12px 55px;
}

.story-header{
padding:22px 18px;
}

.story-header h1{
font-size:30px;
}

.section-header{
padding:17px;
}

.chapter{
padding:15px 17px;
}

.chapter-info{
gap:11px;
}

.chapter-number{
width:37px;
height:37px;
font-size:13px;
}

.chapter-title{
font-size:14px;
}

.chapter-action .btn{
padding:8px 10px;
font-size:12px;
}

}

</style>
</head>

<body>

<header>

<div class="header-inner">

<a href="index.html" class="logo">
NET SIMULIZI
</a>

<div class="header-right">

<button
class="btn"
onclick="toggleDark()"
title="Dark mode"
>
◐
</button>

<a
href="index.html"
class="btn"
>
Home
</a>

</div>

</div>

</header>


<main class="wrap">

<section
id="storyHeader"
class="story-header"
>

<div class="loading">
Inapakia taarifa za hadithi...
</div>

</section>


<section class="section">

<div class="section-header">

<h2>
Chapters
</h2>

<div
id="chapterCount"
class="chapter-count"
>
Inapakia...
</div>

</div>


<div
id="chapterList"
class="chapter-list"
>

<div class="loading">
Inapakia chapters...
</div>

</div>

</section>

</main>


<footer class="footer">

<span class="logo">
NET SIMULIZI
</span>

<p>
Soma, gundua na furahia simulizi zako.
</p>

<p>
© 2026 Net Simulizi. All rights reserved.
</p>

</footer>


<script>

const API = "/api";


/* =========================
   DARK MODE
========================= */

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"netsimulizi_dark",
document.body.classList.contains("dark")
);

}


function loadDarkMode(){

if(
localStorage.getItem(
"netsimulizi_dark"
) === "true"
){

document.body.classList.add("dark");

}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   STORY ID
========================= */

function getStoryId(){

const params =
new URLSearchParams(
window.location.search
);

const id =
Number(params.get("id"));

if(
!Number.isInteger(id) ||
id <= 0
){

return null;

}

return id;

}


/* =========================
   FORMAT NUMBER
========================= */

function formatNumber(value){

return Number(
value || 0
).toLocaleString();

}


/* =========================
   LOAD STORY
========================= */

async function loadStory(){

const storyId =
getStoryId();

const container =
document.getElementById(
"storyHeader"
);


if(!storyId){

container.innerHTML = `

<div class="error">

Story ID haijapatikana.

<br><br>

<a
href="discover.html"
class="btn primary"
>
Rudi Discover
</a>

</div>

`;

return;

}


try{

const response =
await fetch(
`${API}/stories/${storyId}`,
{
method:"GET",
headers:{
"Accept":"application/json"
},
cache:"no-store"
}
);


const data =
await response.json();


if(
!response.ok ||
!data.success ||
!data.story
){

throw new Error(
data.message ||
"Hadithi haijapatikana."
);

}


const story =
data.story;


container.innerHTML = `

<a
href="story.html?id=${encodeURIComponent(story.id)}"
class="back"
>
← Rudi kwenye hadithi
</a>

<h1>
${escapeHTML(
story.title ||
"Untitled Story"
)}
</h1>

<p class="author">
${escapeHTML(
story.author_name ||
story.author ||
"Net Simulizi"
)}
</p>

<p class="story-description">
${escapeHTML(
story.description ||
"Hakuna maelezo ya hadithi kwa sasa."
)}
</p>

<div class="stats">

<span class="stat">
📚 ${escapeHTML(
story.category_name ||
story.category ||
"Story"
)}
</span>

<span class="stat">
👁 ${formatNumber(
story.readers_count
)}
 readers
</span>

<span class="stat">
🌐 ${escapeHTML(
story.language ||
"sw"
)}
</span>

</div>

`;


}catch(error){

console.error(
"Story error:",
error
);


container.innerHTML = `

<div class="error">

Imeshindikana kupakia hadithi.

<br><br>

<button
class="btn primary retry"
onclick="loadStory()"
>
Jaribu Tena
</button>

</div>

`;

}

}


/* =========================
   LOAD CHAPTERS
========================= */

async function loadChapters(){

const storyId =
getStoryId();

const list =
document.getElementById(
"chapterList"
);

const count =
document.getElementById(
"chapterCount"
);


if(!storyId){

list.innerHTML = `

<div class="error">

Story ID haijapatikana.

</div>

`;

count.textContent =
"0 chapters";

return;

}


try{

const response =
await fetch(
`${API}/stories/${storyId}/chapters`,
{
method:"GET",
headers:{
"Accept":"application/json"
},
cache:"no-store"
}
);


const data =
await response.json();


console.log(
"Net Simulizi chapters:",
data
);


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Chapters hazikupatikana."
);

}


let chapters =
Array.isArray(data.chapters)
? data.chapters
: [];


if(!chapters.length){

list.innerHTML = `

<div class="empty">

Hakuna chapters zilizowekwa kwa hadithi hii bado.

</div>

`;

count.textContent =
"0 chapters";

return;

}


/* SORT CHAPTERS */

chapters.sort(
function(a,b){

return Number(
a.chapter_number ??
a.number ??
a.chapter_no ??
0
)
-
Number(
b.chapter_number ??
b.number ??
b.chapter_no ??
0
);

});


count.textContent =
chapters.length +
(chapters.length === 1
? " chapter"
: " chapters");


const fragment =
document.createDocumentFragment();


chapters.forEach(
function(chapter,index){

const number =
chapter.chapter_number ??
chapter.number ??
chapter.chapter_no ??
(index + 1);


const title =
chapter.title ||
`Chapter ${number}`;


const words =
chapter.word_count ??
chapter.words ??
0;


const status =
chapter.status ||
"published";


const item =
document.createElement("div");

item.className =
"chapter";


item.innerHTML = `

<div class="chapter-info">

<div class="chapter-number">
${escapeHTML(number)}
</div>

<div class="chapter-details">

<div class="chapter-title">
${escapeHTML(title)}
</div>

<div class="chapter-meta">

${words
? formatNumber(words) + " words · "
: ""
}

${escapeHTML(status)}

</div>

</div>

</div>


<div class="chapter-action">

<a
class="btn primary"
href="reader.html?story_id=${encodeURIComponent(storyId)}&chapter_id=${encodeURIComponent(chapter.id)}"
>
Soma
</a>

</div>

`;


fragment.appendChild(item);

});


list.innerHTML = "";

list.appendChild(fragment);


}catch(error){

console.error(
"Chapters error:",
error
);


list.innerHTML = `

<div class="error">

Imeshindikana kupakia chapters.

<br><br>

<button
class="btn primary"
onclick="loadChapters()"
>
Jaribu Tena
</button>

</div>

`;

count.textContent =
"Error";

}

}


/* =========================
   START
========================= */

window.addEventListener(
"DOMContentLoaded",
function(){

loadDarkMode();

loadStory();

loadChapters();

});

</script>

</body>
</html>
