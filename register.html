<section class="card">

    <div class="logo-box">
        <img src="Logo.png" alt="Net Simulizi">
    </div>

    <h1>Jisajili</h1>

    <p class="subtitle">
        Fungua akaunti yako ya Net Simulizi
    </p>


    <form id="registerForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                placeholder="Weka username yako"
                minlength="3"
                required
                autocomplete="username">

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="Weka email yako"
                required
                autocomplete="email">

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Angalau characters 8"
                minlength="8"
                required
                autocomplete="new-password">

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                placeholder="Rudia password"
                minlength="8"
                required
                autocomplete="new-password">

        </div>


        <button
            id="registerButton"
            class="btn primary"
            type="submit">

            Endelea

        </button>


        <div
            id="registerMessage"
            class="message">
        </div>

    </form>


    <div class="login-link">

        Tayari una akaunti?

        <a href="login.html">
            Ingia hapa
        </a>

    </div>

</section>

<script>

const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");

const registerMessage =
    document.getElementById("registerMessage");


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        registerMessage.className =
            "message show";

        registerMessage.textContent =
            "Inasajili akaunti...";


        registerButton.disabled = true;


        if (password !== confirmPassword) {

            registerMessage.textContent =
                "Passwords hazifanani.";

            registerButton.disabled = false;

            return;
        }


        try {

           const response =
    await fetch(
        "https://netsimulizi.pages.dev/api/register",
        {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                email:
                                    email,

                                password:
                                    password
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                registerMessage.textContent =
                    data.message ||
                    "Usajili umeshindikana.";

                registerButton.disabled =
                    false;

                return;
            }


            registerMessage.textContent =
                "Akaunti imetengenezwa vizuri!";


            registerForm.reset();


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1500
            );


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );


            registerMessage.textContent =
                "Imeshindikana kuwasiliana na Net Simulizi API.";


            registerButton.disabled =
                false;
        }

    }
);

</script>
