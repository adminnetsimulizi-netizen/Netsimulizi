```html
<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jisajili — Net Simulizi</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f0e5;
  color:#191713;
  font-family:Arial,sans-serif
}

body.dark{
  background:#111;
  color:#eee
}

.top{
  background:#171512;
  color:#fff;
  padding:16px;
  display:flex;
  justify-content:space-between
}

.logo{
  color:#d4aa43;
  font-weight:900;
  letter-spacing:2px
}

.btn{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #d4aa43;
  background:transparent;
  color:inherit;
  cursor:pointer
}

.primary{
  background:#d4aa43;
  color:#171512;
  border:0
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px
}

.card,.hero{
  background:#fffdf8;
  border:1px solid #e4dccd;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px
}

.dark .card,.dark .hero{
  background:#1d1b18;
  border-color:#38342d
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.cover{
  aspect-ratio:2/3;
  border-radius:10px;
  background:linear-gradient(145deg,#211d17,#a47b28);
  color:#fff;
  padding:12px;
  display:flex;
  align-items:end;
  font-weight:900
}

.muted{
  color:#777
}

.form{
  max-width:550px;
  margin:auto
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:12px;
  margin:6px 0 14px;
  border:1px solid #ddd;
  border-radius:8px;
  background:transparent;
  color:inherit
}

.footer{
  background:#171512;
  color:#aaa;
  text-align:center;
  padding:30px
}

.tag{
  display:inline-block;
  padding:8px 12px;
  border:1px solid #ddd;
  border-radius:20px;
  margin:4px
}

#registerMessage{
  margin-top:15px;
  font-weight:bold
}

@media(max-width:700px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}
</style>
</head>

<body>

<header class="top">

  <a class="logo" href="../public/index.html">
    NET SIMULIZI
  </a>

  <div>
    <button
      class="btn"
      onclick="document.body.classList.toggle('dark')">
      ◐
    </button>

    <button
      class="btn"
      onclick="location.href='../public/land.html'">
      EN/SW
    </button>
  </div>

</header>


<main class="wrap">

  <section class="card form">

    <h1>Jisajili</h1>

    <p class="muted">
      Fungua akaunti ya msomaji.
    </p>


    <form id="registerForm">

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        required
      >


      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >


      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >


      <button
        class="btn primary"
        type="submit"
        id="registerButton">
        Endelea
      </button>


      <p
        id="registerMessage"
        class="muted">
      </p>

    </form>

  </section>

</main>


<footer class="footer">

  <b class="logo">
    NET SIMULIZI
  </b>

  <p>
    Digital Storytelling Platform
  </p>

  <p>
    © 2026 Net Simulizi
  </p>

</footer>


<script>

const registerForm =
  document.getElementById("registerForm");

const registerButton =
  document.getElementById("registerButton");

const registerMessage =
  document.getElementById("registerMessage");


registerForm.addEventListener("submit", async function(event) {

  event.preventDefault();


  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  registerMessage.textContent =
    "Inasajili akaunti...";

  registerButton.disabled = true;


  if (password !== confirmPassword) {

    registerMessage.textContent =
      "Passwords hazifanani.";

    registerButton.disabled = false;

    return;
  }


  if (password.length < 8) {

    registerMessage.textContent =
      "Password lazima iwe na angalau herufi 8.";

    registerButton.disabled = false;

    return;
  }


  try {

    const response = await fetch("/api/register", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        username: username,

        email: email,

        password: password

      })

    });


    const data = await response.json();


    if (response.ok && data.success) {

      registerMessage.textContent =
        "Akaunti imefunguliwa kikamilifu.";

      registerMessage.style.color =
        "green";


      registerForm.reset();


      setTimeout(function() {

        window.location.href =
          "login.html";

      }, 1500);


    } else {

      registerMessage.textContent =
        data.message ||
        "Usajili umeshindikana.";

      registerMessage.style.color =
        "red";

      registerButton.disabled = false;

    }


  } catch (error) {

    console.error("Register error:", error);

    registerMessage.textContent =
      "Imeshindikana kuwasiliana na Net Simulizi API.";

    registerMessage.style.color =
      "red";

    registerButton.disabled = false;

  }

});

</script>

</body>
</html>
