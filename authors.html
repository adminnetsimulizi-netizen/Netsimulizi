```html

<style>

  box-sizing:border-box

body{

  background:#111;

.top{

.dark .card,
.dark .hero{

.hero{

  margin:0 0 10px;

}

.muted{
  color:#777

.dark .muted{
  color:#aaa

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:20px
}

.search-box input{
  flex:1;
  padding:13px;

}


/* AUTHORS GRID */

.grid{
  display:grid;

  gap:15px
}

.author-card{
  background:#fffdf8;
  border:1px solid #e4dccd;

.dark .author-card{
  background:#1d1b18;

.avatar{

.dark .author-role{
  background:#342b1d;
  color:#d4aa43
}

.author-bio{
  color:#777;
  font-size:13px;

}

.dark .author-bio{
  color:#aaa

.author-stats{
  display:flex;

  }

  color:#aaa

.error{
  display:none;

}


/* MOBILE */

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(3,1fr)

  .grid{
    grid-template-columns:repeat(2,1fr)

  .wrap{
    padding:15px
  }

  .hero h1{
    font-size:26px
  }

  .search-box{
    flex-direction:column
  }

  .grid{
    grid-template-columns:1fr

  .top{

  }

</style>

</head>


<body>


<!-- HEADER -->

<header class="top">

  <a class="logo" href="index.html">
    NET SIMULIZI
  </a>

  <div>

    <button
      class="btn"
      id="darkBtn"
      type="button"
    >
      ◐
    </button>

    <button
      class="btn"
      type="button"
      onclick="location.href='index.html'"
    >
      Home
    </button>

  </div>

</header>


<!-- MAIN -->

<main class="wrap">


  <!-- HERO -->

  <section class="hero">

    <h1>Authors</h1>

    <p class="muted">
      Kutana na waandishi wanaochapisha hadithi
      zao kupitia Net Simulizi.
    </p>

  </section>


  <!-- SEARCH -->

  <section class="card">

    <div class="search-box">

      <input
        type="search"
        id="authorSearch"
        placeholder="Tafuta mwandishi..."
      >

      <button
        class="btn primary"
        id="searchBtn"
        type="button"
      >
        Tafuta
      </button>

    </div>


    <!-- ERROR -->

    <div
      id="errorBox"
      class="error"
    ></div>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      Inapakia waandishi...

    </div>


    <!-- EMPTY -->

    <div
      id="empty"
      class="empty"
    >

      <h3>Hakuna waandishi</h3>

      <p>
        Kwa sasa hakuna waandishi waliowekwa kwenye mfumo.
      </p>

    </div>


    <!-- AUTHORS -->

    <div
      id="authorsGrid"
      class="grid"
    ></div>

  </section>


</main>


<!-- FOOTER -->

<footer class="footer">

  <b class="logo">
    NET SIMULIZI
  </b>

  <p>
    Digital Storytelling Platform
  </p>

  <p>
    © 2026 Net Simulizi
  </p>

</footer>


<script>


/* =========================
   DARK MODE
========================= */

const darkBtn =
  document.getElementById("darkBtn");


if(
  localStorage.getItem("netsimulizi_dark") === "1"
){

  document.body.classList.add("dark");

}


darkBtn.addEventListener("click",function(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "netsimulizi_dark",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );

});


/* =========================
   ELEMENTS
========================= */

const grid =
  document.getElementById("authorsGrid");

const loading =
  document.getElementById("loading");

const empty =
  document.getElementById("empty");

const errorBox =
  document.getElementById("errorBox");

const searchInput =
  document.getElementById("authorSearch");

const searchBtn =
  document.getElementById("searchBtn");


let allAuthors = [];


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   AUTHOR INITIAL
========================= */

function getInitial(name){

  if(!name){
    return "A";
  }

  return String(name)
    .trim()
    .charAt(0)
    .toUpperCase();

}


/* =========================
   AUTHOR CARD
========================= */

function authorCard(author){

  const id =
    author.id ||
    author.user_id ||
    author.author_id ||
    "";

  const name =
    author.name ||
    author.username ||
    author.display_name ||
    "Unknown Author";

  const bio =
    author.bio ||
    author.description ||
    "Mwandishi wa Net Simulizi.";

  const stories =
    author.story_count ??
    author.stories_count ??
    0;

  const followers =
    author.followers ??
    author.followers_count ??
    0;

  return `

    <article class="author-card">

      <div class="avatar">
        ${escapeHTML(getInitial(name))}
      </div>

      <div class="author-name">
        ${escapeHTML(name)}
      </div>

      <div class="author-role">
        AUTHOR
      </div>

      <div class="author-bio">
        ${escapeHTML(bio)}
      </div>

      <div class="author-stats">

        <div class="stat">

          <strong>
            ${escapeHTML(stories)}
          </strong>

          Hadithi

        </div>

        <div class="stat">

          <strong>
            ${escapeHTML(followers)}
          </strong>

          Followers

        </div>

      </div>

      <button
        class="view-btn"
        type="button"
        onclick="openAuthor('${escapeHTML(id)}')"
      >
        Tazama Mwandishi
      </button>

    </article>

  `;

}


/* =========================
   RENDER
========================= */

function renderAuthors(authors){

  grid.innerHTML = "";

  loading.style.display = "none";

  errorBox.style.display = "none";


  if(!authors || !authors.length){

    empty.style.display = "block";

    return;

  }


  empty.style.display = "none";


  grid.innerHTML =
    authors
      .map(authorCard)
      .join("");

}


/* =========================
   LOAD AUTHORS
========================= */

async function loadAuthors(){

  loading.style.display = "block";

  empty.style.display = "none";

  errorBox.style.display = "none";

  grid.innerHTML = "";


  try{

    /*
     * Endpoint ya authors.
     *
     * Ikiwa endpoint bado haijaongezwa
     * backend, tutaendelea bila kuvunja page.
     */

    const response =
      await fetch("/api/authors");


    if(!response.ok){

      throw new Error(
        "Authors API haijapatikana bado."
      );

    }


    const data =
      await response.json();


    /*
     * Kubali formats mbalimbali za API.
     */

    if(Array.isArray(data)){

      allAuthors = data;

    }else if(Array.isArray(data.authors)){

      allAuthors = data.authors;

    }else if(Array.isArray(data.data)){

      allAuthors = data.data;

    }else{

      allAuthors = [];

    }


    renderAuthors(allAuthors);


  }catch(error){

    console.error(
      "Authors error:",
      error
    );

    loading.style.display = "none";


    /*
     * Kwa sasa backend inaweza kuwa bado
     * haijawa na /api/authors.
     *
     * Hatuonyeshi error kubwa kwa user.
     */

    empty.style.display = "block";

    empty.innerHTML = `

      <h3>Authors</h3>

      <p>
        Orodha ya waandishi itaonekana hapa
        baada ya data ya waandishi kuunganishwa
        kwenye mfumo.
      </p>

    `;

  }

}


/* =========================
   SEARCH AUTHORS
========================= */

function searchAuthors(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  if(!keyword){

    renderAuthors(allAuthors);

    return;

  }


  const filtered =
    allAuthors.filter(author => {

      const name =
        String(
          author.name ||
          author.username ||
          author.display_name ||
          ""
        ).toLowerCase();

      const bio =
        String(
          author.bio ||
          author.description ||
          ""
        ).toLowerCase();

      return (
        name.includes(keyword) ||
        bio.includes(keyword)
      );

    });


  renderAuthors(filtered);

}


searchBtn.addEventListener(
  "click",
  searchAuthors
);


searchInput.addEventListener(
  "input",
  searchAuthors
);


searchInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      searchAuthors();

    }

  }
);


/* =========================
   OPEN AUTHOR
========================= */

function openAuthor(id){

  if(!id){

    return;

  }


  /*
   * Ukurasa wa author profile
   * unaweza kutumika baadaye.
   */

  window.location.href =
    "author-profile.html?id=" +
    encodeURIComponent(id);

}


/* =========================
   START
========================= */

loadAuthors();


</script>

</body>

</html>
