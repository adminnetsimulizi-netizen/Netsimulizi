```html
<!doctype html>

<style>
*{
  box-sizing:border-box;

body{
  margin:0;

  color:#191713;

  color:inherit;
  cursor:pointer;

.primary{

  background:#1d1b18;

  width:100%;

</head>

<body>

<header class="top">

  <a class="logo" href="index.html">
    <img src="Logo.png" alt="Net Simulizi" class="logo-image">
  </a>

  <div class="top-actions">
    <button class="btn" onclick="toggleDarkMode()">◐</button>
    <button class="btn" onclick="location.href='land.html'">EN/SW</button>
  </div>

</header>


<main class="wrap">

  <section class="hero">
    <h1>Maktaba Yangu</h1>
    <p class="muted">
      Hadithi ulizohifadhi kwenye Maktaba yako.
    </p>
  </section>

  <div id="errorBox" class="error"></div>

  <div id="loading" class="loading">
    Inapakia Maktaba...
  </div>

  <section id="libraryGrid" class="grid" style="display:none;"></section>

  <section id="emptyBox" class="empty" style="display:none;">

    <div class="empty-icon">📚</div>

    <h2>Maktaba yako iko tupu</h2>

    <p>
      Bado hujahifadhi hadithi yoyote.
      Tafuta hadithi unayoipenda kisha bonyeza
      <b>+ Maktaba</b>.
    </p>

    <button class="btn primary" onclick="location.href='index.html'">
      Tafuta Hadithi
    </button>

  </section>

</main>


<footer class="footer">

  <img src="Logo.png" alt="Net Simulizi" class="footer-logo">

  <p>Digital Storytelling Platform</p>

  <p>© 2026 Net Simulizi</p>

</footer>


<script>

const API = "/api";


/* =========================
   DARK MODE
========================= */

function loadDarkMode(){

  const dark =
    localStorage.getItem("netsimulizi_dark") === "true";

  if(dark){
    document.body.classList.add("dark");
  }
}


function toggleDarkMode(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "netsimulizi_dark",
    document.body.classList.contains("dark")
  );
}


/* =========================
   GET CURRENT USER
========================= */

function getCurrentUser(){

  try{

    const saved =
      localStorage.getItem("netsimulizi_user");

    if(!saved){
      return null;
    }

    return JSON.parse(saved);

  }catch(error){

    console.error("User data error:",error);

    return null;
  }
}


/* =========================
   ERROR
========================= */

function showError(message){

  const box =
    document.getElementById("errorBox");

  box.textContent = message;
  box.style.display = "block";
}


/* =========================
   LOAD LIBRARY
========================= */

async function loadLibrary(){

  const user = getCurrentUser();

  const loading =
    document.getElementById("loading");

  const grid =
    document.getElementById("libraryGrid");

  const empty =
    document.getElementById("emptyBox");


  if(!user){

    loading.style.display = "none";

    empty.innerHTML = `
      <div class="login-box">

        <div class="empty-icon">🔐</div>

        <h2>Ingia kwanza</h2>

        <p>
          Ili kuona hadithi ulizohifadhi,
          tafadhali ingia kwenye akaunti yako.
        </p>

        <button
          class="btn primary"
          onclick="location.href='land.html'">
          Ingia
        </button>

      </div>
    `;

    empty.style.display = "block";

    return;
  }


  try{

    const response =
      await fetch(`${API}/bookmarks/${user.id}`);


    if(!response.ok){

      throw new Error(
        "Imeshindikana kupata Maktaba."
      );
    }


    const data =
      await response.json();


    if(!data.success){

      throw new Error(
        data.message || "Imeshindikana kupata Maktaba."
      );
    }


    const bookmarks =
      data.bookmarks || [];


    loading.style.display = "none";


    if(bookmarks.length === 0){

      empty.style.display = "block";

      return;
    }


    grid.innerHTML = "";


    /*
      API inaweza kurudisha story details
      ndani ya bookmark, au story_id pekee.
      Kwa hiyo tunapata story kwa ID pale
      ambapo details hazipo.
    */

    const stories = await Promise.all(

      bookmarks.map(async bookmark => {

        if(bookmark.title){

          return {
            bookmark,
            story: bookmark
          };

        }


        try{

          const storyResponse =
            await fetch(
              `${API}/stories/${bookmark.story_id}`
            );


          const storyData =
            await storyResponse.json();


          if(storyData.success){

            return {
              bookmark,
              story: storyData.story
            };

          }

        }catch(error){

          console.error(
            "Story loading error:",
            error
          );

        }


        return {
          bookmark,
          story: null
        };

      })

    );


    stories.forEach(item => {

      if(item.story){

        renderStory(
          item.bookmark,
          item.story
        );

      }

    });


    if(grid.children.length === 0){

      empty.style.display = "block";

    }else{

      grid.style.display = "grid";

    }


  }catch(error){

    console.error(error);

    loading.style.display = "none";

    showError(
      error.message ||
      "Kuna tatizo la kupakia Maktaba."
    );

  }

}


/* =========================
   RENDER STORY
========================= */

function renderStory(bookmark, story){

  const grid =
    document.getElementById("libraryGrid");


  const storyId =
    story.id || bookmark.story_id;


  const title =
    story.title || "Hadithi";


  const author =
    story.author_name ||
    story.author ||
    "Net Simulizi";


  const cover =
    story.cover_url ||
    story.cover ||
    "";


  const card =
    document.createElement("div");

  card.className = "story-card";


  let coverHTML = "";


  if(cover){

    coverHTML = `
      <img
        src="${escapeHTML(cover)}"
        alt="${escapeHTML(title)}"
        class="cover-image"
        onerror="this.style.display='none';this.parentElement.querySelector('.fallback-cover').style.display='flex';"
      >
    `;

  }


  card.innerHTML = `

    <a
      href="story.html?id=${encodeURIComponent(storyId)}"
      style="text-decoration:none;color:inherit;display:block;"
    >

      <div class="cover">

        ${coverHTML}

        <div
          class="fallback-cover"
          style="
            ${cover ? "display:none;" : "display:flex;"}
            width:100%;
            height:100%;
            align-items:flex-end;
          "
        >
          ${escapeHTML(title)}
        </div>

      </div>

      <span class="story-title">
        ${escapeHTML(title)}
      </span>

      <span class="story-author">
        ${escapeHTML(author)}
      </span>

    </a>

    <button
      class="remove-btn"
      title="Ondoa kwenye Maktaba"
      onclick="removeBookmark(event, ${storyId})"
    >
      ✕
    </button>

  `;


  grid.appendChild(card);
}


/* =========================
   REMOVE BOOKMARK
========================= */

async function removeBookmark(event, storyId){

  event.preventDefault();
  event.stopPropagation();


  const user =
    getCurrentUser();


  if(!user){

    alert("Tafadhali ingia kwanza.");

    return;
  }


  const confirmed =
    confirm(
      "Unataka kuondoa hadithi hii kwenye Maktaba?"
    );


  if(!confirmed){

    return;
  }


  try{

    const response =
      await fetch(
        `${API}/bookmarks/${user.id}/${storyId}`,
        {
          method:"DELETE"
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Imeshindikana kuondoa hadithi."
      );

    }


    /*
      Pakia Maktaba tena baada ya kuondoa.
    */

    document.getElementById(
      "libraryGrid"
    ).style.display = "none";


    document.getElementById(
      "loading"
    ).style.display = "block";


    document.getElementById(
      "emptyBox"
    ).style.display = "none";


    await loadLibrary();


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Imeshindikana kuondoa hadithi."
    );

  }

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   START
========================= */

loadDarkMode();

loadLibrary();

</script>

</body>
</html>
