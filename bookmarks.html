<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bookmarks - Net Simulizi</title>

  <style>
    :root{
      --bg:#090b10;
      --surface:#11141b;
      --surface-2:#171b24;
      --gold:#e5a51c;
      --gold-light:#f2bd3d;
      --text:#fff;
      --muted:#a8afbd;
      --border:rgba(255,255,255,.09);
      --danger:#e05252;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(9,11,16,.96);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:21px;
      font-weight:800;
    }

    .brand img{
      width:42px;
      height:42px;
      object-fit:contain;
      border-radius:10px;
    }

    .brand span{
      color:var(--gold-light);
    }

    nav{
      display:flex;
      align-items:center;
      gap:20px;
    }

    nav a{
      color:var(--muted);
      font-size:14px;
      transition:.2s;
    }

    nav a:hover,
    nav a.active{
      color:var(--gold-light);
    }

    .menu-btn{
      display:none;
      border:0;
      background:var(--surface-2);
      color:#fff;
      font-size:23px;
      width:42px;
      height:42px;
      border-radius:10px;
      cursor:pointer;
    }

    main{
      max-width:1200px;
      margin:auto;
      padding:35px 20px 70px;
    }

    .page-head{
      margin-bottom:28px;
    }

    .page-head h1{
      font-size:30px;
      margin-bottom:8px;
    }

    .page-head p{
      color:var(--muted);
      font-size:14px;
    }

    .login-box,
    .empty-box{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      padding:40px 25px;
      text-align:center;
    }

    .login-box h2,
    .empty-box h2{
      margin-bottom:10px;
      font-size:22px;
    }

    .login-box p,
    .empty-box p{
      color:var(--muted);
      margin-bottom:22px;
      line-height:1.6;
    }

    .btn{
      display:inline-block;
      border:0;
      border-radius:9px;
      padding:11px 18px;
      background:var(--gold);
      color:#111;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
    }

    .btn:hover{
      background:var(--gold-light);
      transform:translateY(-1px);
    }

    .bookmarks{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:18px;
      align-items:start;
    }

    .bookmark-card{
      overflow:hidden;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:12px;
      transition:.2s;
      min-width:0;
    }

    .bookmark-card:hover{
      transform:translateY(-3px);
      border-color:rgba(229,165,28,.35);
    }

    .cover-wrap{
      position:relative;
      width:100%;
      aspect-ratio:2/3;
      background:var(--surface-2);
      overflow:hidden;
    }

    .cover-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .bookmark-icon{
      position:absolute;
      top:9px;
      right:9px;
      width:34px;
      height:34px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(0,0,0,.7);
      color:var(--gold-light);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
    }

    .card-body{
      padding:13px;
    }

    .card-title{
      font-size:16px;
      font-weight:700;
      line-height:1.3;
      margin-bottom:7px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .author{
      color:var(--muted);
      font-size:12px;
      margin-bottom:12px;
    }

    .card-actions{
      display:flex;
      gap:7px;
    }

    .read-btn{
      flex:1;
      text-align:center;
      padding:9px 6px;
      border-radius:7px;
      background:var(--gold);
      color:#111;
      font-size:12px;
      font-weight:700;
    }

    .delete-btn{
      width:38px;
      border:1px solid rgba(224,82,82,.3);
      background:rgba(224,82,82,.08);
      color:var(--danger);
      border-radius:7px;
      cursor:pointer;
      font-size:16px;
    }

    .status{
      color:var(--muted);
      text-align:center;
      padding:35px 10px;
    }

    .error{
      color:#ff8b8b;
      text-align:center;
      padding:30px 10px;
    }

    footer{
      border-top:1px solid var(--border);
      padding:25px 20px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }

    @media(max-width:1050px){
      .bookmarks{
        grid-template-columns:repeat(4,1fr);
      }
    }

    @media(max-width:800px){
      nav{
        display:none;
        position:absolute;
        top:70px;
        left:0;
        right:0;
        padding:15px 20px 20px;
        background:var(--surface);
        border-bottom:1px solid var(--border);
        flex-direction:column;
        align-items:flex-start;
      }

      nav.open{
        display:flex;
      }

      .menu-btn{
        display:block;
      }

      .bookmarks{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:560px){
      .header-inner{
        padding:11px 14px;
      }

      .brand{
        font-size:18px;
      }

      .brand img{
        width:37px;
        height:37px;
      }

      main{
        padding:28px 14px 55px;
      }

      .page-head h1{
        font-size:25px;
      }

      .bookmarks{
        grid-template-columns:repeat(2,1fr);
        gap:13px;
      }

      .card-body{
        padding:10px;
      }

      .card-title{
        font-size:14px;
      }

      .author{
        font-size:11px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="brand">
      <img src="Logo.png" alt="Net Simulizi">
      <span>Net Simulizi</span>
    </a>

    <button class="menu-btn" id="menuBtn">☰</button>

    <nav id="nav">
      <a href="index.html">Nyumbani</a>
      <a href="discover.html">Gundua</a>
      <a href="categories.html">Categories</a>
      <a href="library.html">Maktaba</a>
      <a href="history.html">Historia</a>
      <a href="bookmarks.html" class="active">Bookmarks</a>
      <a href="profile.html">Wasifu</a>
    </nav>

  </div>
</header>

<main>

  <div class="page-head">
    <h1>🔖 Bookmarks Zangu</h1>
    <p>Hadithi ulizohifadhi kwa ajili ya kusoma baadaye.</p>
  </div>

  <div id="content">
    <div class="status">Inapakia bookmarks...</div>
  </div>

</main>

<footer>
  © 2026 Net Simulizi — Hadithi bora, sehemu moja.
</footer>

<script>
  const API = "/api";

  const menuBtn = document.getElementById("menuBtn");
  const nav = document.getElementById("nav");
  const content = document.getElementById("content");

  menuBtn.addEventListener("click", () => {
    nav.classList.toggle("open");
  });

  function getUser(){
    try{
      return JSON.parse(localStorage.getItem("netsimulizi_user"));
    }catch(e){
      return null;
    }
  }

  function escapeHtml(value){
    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function coverUrl(cover){
    if(!cover){
      return "Logo.png";
    }

    if(
      cover.startsWith("http://") ||
      cover.startsWith("https://") ||
      cover.startsWith("/")
    ){
      return cover;
    }

    return cover;
  }

  async function loadBookmarks(){

    const user = getUser();

    if(!user || !user.id){
      content.innerHTML = `
        <div class="login-box">
          <h2>🔐 Ingia kwanza</h2>
          <p>
            Unahitaji kuingia kwenye akaunti yako ili kuona
            hadithi ulizohifadhi kwenye bookmarks.
          </p>
          <a href="login.html" class="btn">Ingia</a>
        </div>
      `;
      return;
    }

    try{

      const response = await fetch(
        API + "/bookmarks/" + encodeURIComponent(user.id)
      );

      if(!response.ok){
        throw new Error("Imeshindikana kupata bookmarks.");
      }

      const data = await response.json();

      const bookmarks = Array.isArray(data)
        ? data
        : (data.bookmarks || []);

      if(!bookmarks.length){

        content.innerHTML = `
          <div class="empty-box">
            <h2>🔖 Hakuna Bookmarks</h2>
            <p>
              Bado hujahifadhi hadithi yoyote.
              Nenda kwenye hadithi unayoipenda kisha bonyeza
              alama ya bookmark.
            </p>
            <a href="discover.html" class="btn">Gundua Hadithi</a>
          </div>
        `;

        return;
      }

      content.innerHTML = `
        <div class="bookmarks">
          ${bookmarks.map(item => {

            const story = item.story || item;

            const storyId =
              story.id ||
              item.story_id ||
              item.id;

            const title =
              story.title ||
              item.story_title ||
              "Hadithi";

            const author =
              story.author_name ||
              story.author ||
              item.author_name ||
              "Net Simulizi";

            const cover =
              story.cover_image ||
              story.cover ||
              item.cover_image ||
              item.cover ||
              "Logo.png";

            return `
              <article class="bookmark-card">

                <a href="story.html?id=${encodeURIComponent(storyId)}">
                  <div class="cover-wrap">

                    <img
                      src="${escapeHtml(coverUrl(cover))}"
                      alt="${escapeHtml(title)}"
                      onerror="this.src='Logo.png'"
                    >

                    <div class="bookmark-icon">🔖</div>

                  </div>
                </a>

                <div class="card-body">

                  <a
                    href="story.html?id=${encodeURIComponent(storyId)}"
                    class="card-title"
                  >
                    ${escapeHtml(title)}
                  </a>

                  <div class="author">
                    ${escapeHtml(author)}
                  </div>

                  <div class="card-actions">

                    <a
                      href="story.html?id=${encodeURIComponent(storyId)}"
                      class="read-btn"
                    >
                      Soma
                    </a>

                    <button
                      class="delete-btn"
                      title="Ondoa bookmark"
                      onclick="removeBookmark(${Number(storyId)})"
                    >
                      ×
                    </button>

                  </div>

                </div>

              </article>
            `;

          }).join("")}
        </div>
      `;

    }catch(error){

      console.error(error);

      content.innerHTML = `
        <div class="error">
          Imeshindikana kupakia bookmarks kwa sasa.
        </div>
      `;
    }
  }

  async function removeBookmark(storyId){

    const user = getUser();

    if(!user || !user.id){
      return;
    }

    const confirmed = confirm(
      "Una uhakika unataka kuondoa hadithi hii kwenye bookmarks?"
    );

    if(!confirmed){
      return;
    }

    try{

      const response = await fetch(
        API + "/bookmarks/" +
        encodeURIComponent(user.id) +
        "/" +
        encodeURIComponent(storyId),
        {
          method:"DELETE"
        }
      );

      if(!response.ok){
        throw new Error("Delete failed");
      }

      loadBookmarks();

    }catch(error){

      console.error(error);

      alert("Imeshindikana kuondoa bookmark.");
    }
  }

  loadBookmarks();
</script>

</body>
</html>
