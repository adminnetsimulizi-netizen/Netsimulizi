<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Net Simulizi — Language</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171512;color:#fff;font-family:Arial}.box{text-align:center;width:min(500px,92%)}.logo{color:#d4aa43;font-weight:900;font-size:28px;letter-spacing:3px}.lang{width:100%;padding:16px;margin:7px 0;border-radius:9px;background:#28251f;color:#fff;border:1px solid #5b513d;font-weight:bold;font-size:16px}</style></head><body><div class="box"><div class="logo">NET SIMULIZI</div><p>Chagua lugha yako / Choose your language</p><button class="lang" onclick="choose('sw')">KISWAHILI</button><button class="lang" onclick="choose('en')">ENGLISH</button></div><script>try{let l=localStorage.getItem('ns_language');if(l==='sw'||l==='en')location.href='index.html'}catch(e){}function choose(l){try{localStorage.setItem('ns_language',l)}catch(e){}location.href='index.html'}</script></body></html>
