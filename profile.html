<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - Net Simulizi</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#090b10;
    --surface:#11141b;
    --surface2:#171b24;
    --gold:#e5a51c;
    --gold-light:#f2bd3d;
    --text:#fff;
    --muted:#a8afbd;
    --border:rgba(255,255,255,.09);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font:inherit;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(9,11,16,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.header-inner{
    max-width:1280px;
    min-height:72px;
    margin:auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    gap:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:220px;
}

.brand-logo{
    width:46px;
    height:46px;
    object-fit:contain;
    border-radius:10px;
}

.brand-name{
    font-size:21px;
    font-weight:900;
}

.brand-name span{
    color:var(--gold);
}

.header-nav{
    display:flex;
    gap:22px;
    flex:1;
}

.header-nav a{
    color:#d9dde6;
    font-size:14px;
    font-weight:700;
}

.header-nav a:hover{
    color:var(--gold);
}

.account-button{
    display:flex;
    align-items:center;
    gap:9px;
    background:var(--surface);
    border:1px solid var(--border);
    color:white;
    padding:7px 12px;
    border-radius:10px;
    cursor:pointer;
}

.account-button:hover{
    border-color:var(--gold);
}

.account-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    object-fit:cover;
    background:var(--surface2);
    border:1px solid var(--border);
}

.account-name{
    font-weight:700;
    font-size:13px;
}

/* PAGE */

.page{
    max-width:1000px;
    margin:auto;
    padding:45px 20px 80px;
}

.back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;
}

.back-link:hover{
    color:var(--gold);
}

/* PROFILE CARD */

.profile-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}

.profile-cover{
    height:170px;
    background:
        radial-gradient(
            circle at 75% 30%,
            rgba(229,165,28,.25),
            transparent 35%
        ),
        linear-gradient(
            120deg,
            #0d1016,
            #1b1f29
        );
}

.profile-main{
    padding:0 30px 30px;
}

.profile-top{
    display:flex;
    align-items:flex-end;
    gap:20px;
    margin-top:-65px;
    position:relative;
}

.profile-avatar-wrap{
    position:relative;
}

.profile-avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    background:#0d0f15;
    border:5px solid var(--surface);
}

.avatar-button{
    position:absolute;
    right:2px;
    bottom:7px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid var(--surface);
    background:var(--gold);
    color:#111;
    cursor:pointer;
    font-weight:900;
}

.avatar-button:hover{
    background:var(--gold-light);
}

.profile-heading{
    padding-bottom:12px;
}

.profile-heading h1{
    font-size:28px;
    margin-bottom:3px;
}

.profile-heading p{
    color:var(--muted);
    font-size:14px;
}

.profile-body{
    margin-top:30px;
}

/* INFO */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.info-box{
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:17px;
}

.info-label{
    color:var(--muted);
    font-size:12px;
    margin-bottom:7px;
}

.info-value{
    font-size:15px;
    font-weight:700;
    word-break:break-word;
}

/* SECTIONS */

.profile-section{
    margin-top:30px;
}

.profile-section h2{
    font-size:19px;
    margin-bottom:15px;
}

.action-list{
    display:grid;
    gap:10px;
}

.action-button{
    width:100%;
    text-align:left;
    background:var(--surface2);
    border:1px solid var(--border);
    color:white;
    border-radius:10px;
    padding:14px;
    cursor:pointer;
}

.action-button:hover{
    border-color:var(--gold);
    color:var(--gold);
}

.logout{
    color:#ffb4b4;
}

.logout:hover{
    color:#ff8e8e;
    border-color:#7b3030;
}

/* MESSAGE */

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    font-size:13px;
    background:#191d26;
    border:1px solid var(--border);
}

.message.show{
    display:block;
}

.message.error{
    color:#ffb4b4;
    border-color:#7b3030;
}

.message.success{
    color:#b8f5c8;
    border-color:#28643a;
}

/* LOGIN REQUIRED */

.login-required{
    display:none;
    text-align:center;
    padding:70px 20px;
}

.login-required h1{
    margin-bottom:10px;
}

.login-required p{
    color:var(--muted);
    margin-bottom:25px;
}

.login-required button{
    border:0;
    border-radius:9px;
    padding:12px 25px;
    background:var(--gold);
    color:#111;
    font-weight:800;
    cursor:pointer;
}

/* FOOTER */

footer{
    border-top:1px solid var(--border);
    background:#07090d;
    text-align:center;
    padding:25px 20px;
    color:#707785;
    font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

    .header-inner{
        padding:10px 14px;
    }

    .brand{
        min-width:auto;
    }

    .brand-logo{
        width:40px;
        height:40px;
    }

    .brand-name{
        font-size:17px;
    }

    .header-nav{
        display:none;
    }

    .account-name{
        display:none;
    }

    .account-button{
        margin-left:auto;
        padding:5px;
    }

    .page{
        padding:25px 14px 60px;
    }

    .profile-cover{
        height:130px;
    }

    .profile-main{
        padding:0 18px 25px;
    }

    .profile-top{
        margin-top:-55px;
        display:block;
    }

    .profile-avatar{
        width:110px;
        height:110px;
    }

    .profile-heading{
        margin-top:15px;
    }

    .profile-heading h1{
        font-size:23px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>

<div class="header-inner">

<a href="index.html" class="brand">
<img src="Logo.png" class="brand-logo" alt="Net Simulizi Logo">
<div class="brand-name">
NET <span>SIMULIZI</span>
</div>
</a>

<nav class="header-nav">
<a href="index.html">Home</a>
<a href="discover.html">Discover</a>
<a href="categories.html">Categories</a>
<a href="trending.html">Trending</a>
</nav>

<button
    class="account-button"
    onclick="goProfile()"
    id="headerAccount"
>
<img
    id="headerAvatar"
    class="account-avatar"
    src="Logo.png"
    alt="Profile"
>

<span
    id="headerAccountName"
    class="account-name"
>
Account
</span>
</button>

</div>

</header>


<main class="page">

<a href="index.html" class="back-link">
← Rudi Home
</a>


<!-- LOGIN REQUIRED -->

<div id="loginRequired" class="login-required">

<h1>Ingia kwanza</h1>

<p>
Tafadhali ingia kwenye akaunti yako ili kuona profile yako.
</p>

<button onclick="goLogin()">
Login
</button>

</div>


<!-- PROFILE -->

<div id="profileContent" class="profile-card">

<div class="profile-cover"></div>

<div class="profile-main">

<div class="profile-top">

<div class="profile-avatar-wrap">

<img
    id="profileAvatar"
    class="profile-avatar"
    src="Logo.png"
    alt="Profile picture"
>

<button
    class="avatar-button"
    onclick="choosePhoto()"
    title="Badili picha"
>
✎
</button>

<input
    id="photoInput"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="changePhoto(event)"
>

</div>

<div class="profile-heading">

<h1 id="profileUsername">
Username
</h1>

<p>
Net Simulizi Member
</p>

</div>

</div>


<div class="profile-body">

<div class="info-grid">

<div class="info-box">

<div class="info-label">
USERNAME
</div>

<div
    class="info-value"
    id="infoUsername"
>
-
</div>

</div>


<div class="info-box">

<div class="info-label">
EMAIL
</div>

<div
    class="info-value"
    id="infoEmail"
>
-
</div>

</div>


<div class="info-box">

<div class="info-label">
ACCOUNT STATUS
</div>

<div
    class="info-value"
    id="infoStatus"
>
Active
</div>

</div>


<div class="info-box">

<div class="info-label">
MEMBER SINCE
</div>

<div
    class="info-value"
    id="infoDate"
>
-
</div>

</div>

</div>


<div
    id="profileMessage"
    class="message"
></div>


<div class="profile-section">

<h2>
Account
</h2>

<div class="action-list">

<button
    class="action-button"
    onclick="goHome()"
>
← Back to Home
</button>

<button
    class="action-button logout"
    onclick="logoutUser()"
>
Logout
</button>

</div>

</div>

</div>

</div>

</div>

</main>


<footer>

© 2026 Net Simulizi. All rights reserved.

</footer>


<script>

/* GET USER */

function getUser(){

    const savedUser =
        localStorage.getItem("netsimulizi_user");

    if(!savedUser){
        return null;
    }

    try{

        return JSON.parse(savedUser);

    }catch(error){

        console.error(error);

        return null;
    }
}


/* LOAD PROFILE */

function loadProfile(){

    const user = getUser();

    const profileContent =
        document.getElementById("profileContent");

    const loginRequired =
        document.getElementById("loginRequired");

    if(!user){

        profileContent.style.display="none";
        loginRequired.style.display="block";

        return;
    }

    profileContent.style.display="block";
    loginRequired.style.display="none";


    const username =
        user.username ||
        user.name ||
        "User";

    const email =
        user.email ||
        "-";


    document.getElementById(
        "profileUsername"
    ).textContent=username;


    document.getElementById(
        "infoUsername"
    ).textContent=username;


    document.getElementById(
        "infoEmail"
    ).textContent=email;


    document.getElementById(
        "infoStatus"
    ).textContent=
        user.status ||
        "Active";


    document.getElementById(
        "infoDate"
    ).textContent=
        user.created_at ||
        user.createdAt ||
        "Member";


    /* HEADER */

    document.getElementById(
        "headerAccountName"
    ).textContent=username;


    /* SAVED PHOTO */

    const photo =
        localStorage.getItem(
            "netsimulizi_profile_photo"
        );

    if(photo){

        document.getElementById(
            "profileAvatar"
        ).src=photo;

        document.getElementById(
            "headerAvatar"
        ).src=photo;

    }

}


/* PROFILE NAVIGATION */

function goProfile(){

    const user=getUser();

    if(user){

        window.location.href="profile.html";

    }else{

        goLogin();

    }

}


function goLogin(){

    window.location.href="index.html?open=login";

}


function goHome(){

    window.location.href="index.html";

}


/* PHOTO */

function choosePhoto(){

    document.getElementById(
        "photoInput"
    ).click();

}


function changePhoto(event){

    const file=event.target.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){

        showMessage(
            "Tafadhali chagua picha halali.",
            "error"
        );

        return;
    }


    const reader=new FileReader();


    reader.onload=function(e){

        const image=e.target.result;


        localStorage.setItem(
            "netsimulizi_profile_photo",
            image
        );


        document.getElementById(
            "profileAvatar"
        ).src=image;


        document.getElementById(
            "headerAvatar"
        ).src=image;


        showMessage(
            "Picha ya profile imebadilishwa.",
            "success"
        );

    };


    reader.readAsDataURL(file);

}


/* MESSAGE */

function showMessage(message,type){

    const element=
        document.getElementById(
            "profileMessage"
        );

    element.textContent=message;

    element.className=
        "message show "+type;

}


/* LOGOUT */

function logoutUser(){

    localStorage.removeItem(
        "netsimulizi_user"
    );

    localStorage.removeItem(
        "netsimulizi_profile_photo"
    );

    window.location.href="index.html";

}


/* LOAD */

window.addEventListener(
    "DOMContentLoaded",
    loadProfile
);

</script>

</body>
</html>
