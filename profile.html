<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Net Simulizi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .brand h1 {
            font-size: 22px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #333;
            padding: 9px 15px;
            border-radius: 6px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .profile-top {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ddd;
            background: #eee;
        }

        .photo-label {
            display: inline-block;
            margin-top: 12px;
            padding: 9px 15px;
            background: #111;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        #photoInput {
            display: none;
        }

        .profile-name {
            margin-top: 15px;
            font-size: 25px;
            font-weight: bold;
        }

        .profile-email {
            margin-top: 6px;
            color: #666;
        }

        .info {
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            color: #777;
        }

        .info-value {
            font-weight: bold;
            text-align: right;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .action-btn {
            border: none;
            padding: 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            background: #111;
            color: white;
        }

        .logout-btn {
            background: #b00020;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .error {
            text-align: center;
            color: #b00020;
            padding: 20px;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px auto;
            }

            .profile-card {
                padding: 20px;
            }

            .actions {
                grid-template-columns: 1fr;
            }

            .info-row {
                flex-direction: column;
                gap: 5px;
            }

            .info-value {
                text-align: left;
            }

            header {
                padding: 12px 15px;
            }

            .brand h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        <img src="Logo.png" alt="Net Simulizi">
        <h1>Net Simulizi</h1>
    </div>

    <a href="index.html" class="back-btn">
        Home
    </a>

</header>


<main>

    <div class="profile-card">

        <div id="loading" class="loading">
            Inapakia profile...
        </div>

        <div id="profileContent" style="display:none;">

            <div class="profile-top">

                <img
                    id="profilePhoto"
                    class="profile-photo"
                    src="Logo.png"
                    alt="Profile Photo"
                >

                <br>

                <label for="photoInput" class="photo-label">
                    Badili Picha
                </label>

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                >

                <div id="profileName" class="profile-name">
                </div>

                <div id="profileEmail" class="profile-email">
                </div>

            </div>


            <div class="info">

                <div class="info-row">
                    <span class="info-label">
                        Username
                    </span>

                    <span
                        id="username"
                        class="info-value">
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Email
                    </span>

                    <span
                        id="email"
                        class="info-value">
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Account Type
                    </span>

                    <span
                        id="role"
                        class="info-value">
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Status
                    </span>

                    <span
                        id="status"
                        class="info-value">
                    </span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        Member Since
                    </span>

                    <span
                        id="createdAt"
                        class="info-value">
                    </span>
                </div>

            </div>


            <div class="actions">

                <button
                    class="action-btn"
                    onclick="openLibrary()">
                    My Library
                </button>

                <button
                    class="action-btn"
                    onclick="openBookmarks()">
                    Bookmarks
                </button>

                <button
                    class="action-btn"
                    onclick="openHistory()">
                    Reading History
                </button>

                <button
                    class="action-btn"
                    onclick="openSettings()">
                    Settings
                </button>

                <button
                    class="action-btn logout-btn"
                    onclick="logoutUser()">
                    Logout
                </button>

            </div>

        </div>


        <div id="errorMessage"
             class="error"
             style="display:none;">
        </div>

    </div>

</main>


<script>

    // =========================================
    // LOAD USER FROM LOCAL STORAGE
    // =========================================

    async function loadProfile() {

        const storedUser =
            localStorage.getItem("netsimulizi_user");

        if (!storedUser) {

            window.location.href =
                "index.html?open=login";

            return;
        }


        let user;

        try {

            user = JSON.parse(storedUser);

        } catch (error) {

            localStorage.removeItem(
                "netsimulizi_user"
            );

            window.location.href =
                "index.html?open=login";

            return;
        }


        if (!user.id) {

            showError(
                "Taarifa za akaunti hazina user ID."
            );

            return;
        }


        try {

            const response = await fetch(
                `/api/profile/${user.id}`
            );


            const data = await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Imeshindikana kupakia profile."
                );
            }


            displayProfile(data.user);


        } catch (error) {

            console.error(error);

            showError(
                "Imeshindikana kupakia profile. Tafadhali jaribu tena."
            );
        }
    }


    // =========================================
    // DISPLAY PROFILE
    // =========================================

    function displayProfile(user) {

        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "profileContent"
        ).style.display = "block";


        document.getElementById(
            "profileName"
        ).textContent = user.username;


        document.getElementById(
            "profileEmail"
        ).textContent = user.email;


        document.getElementById(
            "username"
        ).textContent = user.username;


        document.getElementById(
            "email"
        ).textContent = user.email;


        document.getElementById(
            "role"
        ).textContent = user.role;


        document.getElementById(
            "status"
        ).textContent = user.status;


        document.getElementById(
            "createdAt"
        ).textContent = formatDate(
            user.created_at
        );


        loadSavedPhoto();
    }


    // =========================================
    // DATE FORMAT
    // =========================================

    function formatDate(dateString) {

        if (!dateString) {
            return "-";
        }

        const date = new Date(
            dateString.replace(" ", "T") + "Z"
        );

        if (isNaN(date.getTime())) {
            return dateString;
        }

        return date.toLocaleDateString(
            "en-GB",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
    }


    // =========================================
    // PROFILE PHOTO
    // =========================================

    function loadSavedPhoto() {

        const savedPhoto =
            localStorage.getItem(
                "netsimulizi_profile_photo"
            );

        if (savedPhoto) {

            document.getElementById(
                "profilePhoto"
            ).src = savedPhoto;
        }
    }


    document.getElementById(
        "photoInput"
    ).addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "Tafadhali chagua picha."
                );

                return;
            }


            const reader =
                new FileReader();


            reader.onload = function(e) {

                const imageData =
                    e.target.result;


                document.getElementById(
                    "profilePhoto"
                ).src = imageData;


                localStorage.setItem(
                    "netsimulizi_profile_photo",
                    imageData
                );
            };


            reader.readAsDataURL(file);
        }
    );


    // =========================================
    // ACTIONS
    // =========================================

    function openLibrary() {

        window.location.href =
            "library.html";
    }


    function openBookmarks() {

        window.location.href =
            "library.html";
    }


    function openHistory() {

        alert(
            "Reading History itaunganishwa kwenye mfumo wa kusoma."
        );
    }


    function openSettings() {

        alert(
            "Settings itaongezwa kwenye hatua inayofuata."
        );
    }


    function logoutUser() {

        localStorage.removeItem(
            "netsimulizi_user"
        );

        localStorage.removeItem(
            "netsimulizi_profile_photo"
        );

        window.location.href =
            "index.html";
    }


    // =========================================
    // ERROR
    // =========================================

    function showError(message) {

        document.getElementById(
            "loading"
        ).style.display = "none";


        const error =
            document.getElementById(
                "errorMessage"
            );

        error.textContent = message;

        error.style.display = "block";
    }


    // =========================================
    // START
    // =========================================

    loadProfile();

</script>

</body>
</html>
