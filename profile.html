/* =========================
   ACTIONS
========================= */

    display:grid;

    gap:12px;
    margin-top:30px;
}

.action-btn{
    border:1px solid #d4aa43;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    background:#171512;
    color:white;
}

.action-btn:hover{
    opacity:.9;
}

    background:#9b1829;
    border-color:#9b1829;
}


/* =========================
   LOADING / ERROR
========================= */

.loading{
    text-align:center;
    padding:35px;
    color:#777;
}

.dark .loading{
    color:#aaa;
}

.error{
    text-align:center;
    color:#b00020;

.retry-btn{
    margin-top:15px;
    padding:10px 16px;
    border:1px solid #d4aa43;

    color:#171512;

/* =========================
   FOOTER
========================= */

.footer{
    background:#171512;

}

.footer-logo{
    display:flex;

.footer-logo img{

/* =========================
   MOBILE
========================= */

    header{
        padding:12px 15px;

    .brand img{

    .info-row{

        gap:5px;

    .info-value{
        text-align:left;

        width:100px;

    }

}

<script>


/* =========================
   DARK MODE
========================= */

function loadDarkMode(){

    const dark =
        localStorage.getItem(
            "netsimulizi_dark"
        ) === "true";


    if(dark){

        document.body.classList.add(
            "dark"
        );

    }

}


function toggleDarkMode(){

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "netsimulizi_dark",
        document.body.classList.contains(
            "dark"
        )
    );

}



/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){


    const storedUser =
        localStorage.getItem(
            "netsimulizi_user"
        );


    if(!storedUser){

        window.location.href =
            "login.html";

        return;

    }



    let user;


    try{

        user =
            JSON.parse(storedUser);

    }catch(error){

        localStorage.removeItem(
            "netsimulizi_user"
        );

        window.location.href =
            "login.html";

        return;

    }



    if(!user.id){

        showError(
            "Taarifa za akaunti hazina user ID."
        );

        return;

    }



    try{


        const response =
            await fetch(
                `/api/profile/${user.id}`
            );


        const data =
            await response.json();


        if(!response.ok ||
           !data.success){

            throw new Error(
                data.message ||
                "Imeshindikana kupakia profile."
            );

        }



        displayProfile(
            data.user
        );


        /*
         * Tunahakikisha localStorage
         * ina taarifa mpya kutoka D1.
         */

        localStorage.setItem(
            "netsimulizi_user",
            JSON.stringify(data.user)
        );


    }catch(error){

        console.error(
            "Profile error:",
            error
        );


        showError(
            error.message ||
            "Imeshindikana kupakia profile."
        );

    }

}



/* =========================
   DISPLAY PROFILE
========================= */

function displayProfile(user){


    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "profileContent"
    ).style.display = "block";



    document.getElementById(
        "profileName"
    ).textContent =
        user.username || "-";


    document.getElementById(
        "profileEmail"
    ).textContent =
        user.email || "-";


    document.getElementById(
        "username"
    ).textContent =
        user.username || "-";


    document.getElementById(
        "email"
    ).textContent =
        user.email || "-";


    document.getElementById(
        "role"
    ).textContent =
        user.role || "reader";


    document.getElementById(
        "status"
    ).textContent =
        user.status || "active";


    document.getElementById(
        "createdAt"
    ).textContent =
        formatDate(
            user.created_at
        );


    loadSavedPhoto();

}



/* =========================
   DATE
========================= */

function formatDate(dateString){

    if(!dateString){

        return "-";

    }


    const date =
        new Date(
            String(dateString)
                .replace(" ","T") + "Z"
        );


    if(
        isNaN(
            date.getTime()
        )
    ){

        return dateString;

    }


    return date.toLocaleDateString(
        "en-GB",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}



/* =========================
   PROFILE PHOTO
========================= */

function loadSavedPhoto(){

    const savedPhoto =
        localStorage.getItem(
            "netsimulizi_profile_photo"
        );


    if(savedPhoto){

        document.getElementById(
            "profilePhoto"
        ).src =
            savedPhoto;

    }

}



document.getElementById(
    "photoInput"
).addEventListener(
    "change",
    function(event){


        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "Tafadhali chagua picha."
            );

            return;

        }


        /*
         * Kwa sasa picha inawekwa
         * kwenye localStorage.
         *
         * R2 tutaiunganisha baadaye
         * ili picha ihifadhiwe cloud.
         */

        const reader =
            new FileReader();


        reader.onload =
            function(e){

                const imageData =
                    e.target.result;


                document.getElementById(
                    "profilePhoto"
                ).src =
                    imageData;


                localStorage.setItem(
                    "netsimulizi_profile_photo",
                    imageData
                );

            };


        reader.readAsDataURL(file);

    }
);



/* =========================
   ACTIONS
========================= */

function openLibrary(){

    window.location.href =
        "library.html";

}


function openBookmarks(){

    window.location.href =
        "library.html";

}


function openHistory(){

    window.location.href =
        "history.html";

}


function openSettings(){

    alert(
        "Settings itaunganishwa kwenye hatua inayofuata."
    );

}


function logoutUser(){

    const confirmLogout =
        confirm(
            "Una uhakika unataka kutoka kwenye akaunti?"
        );


    if(!confirmLogout){

        return;

    }


    localStorage.removeItem(
        "netsimulizi_user"
    );


    localStorage.removeItem(
        "netsimulizi_profile_photo"
    );


    window.location.href =
        "index.html";

}



/* =========================
   ERROR
========================= */

function showError(message){


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const error =
        document.getElementById(
            "errorMessage"
        );


    error.innerHTML = `

        <div>
            ${escapeHTML(message)}
        </div>

        <button
            class="retry-btn"
            onclick="location.reload()">

            Jaribu Tena

        </button>

    `;


    error.style.display =
        "block";

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =========================
   START
========================= */

loadDarkMode();

loadProfile();


</script>


</body>
