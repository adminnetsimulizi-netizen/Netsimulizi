<script>

const API = "/api";


/* DARK MODE */

function toggleDark(){

    document.body.classList.toggle("light-mode");

    const dark =
        document.body.classList.contains("light-mode");

    localStorage.setItem(
        "netsimulizi_dark",
        dark ? "false" : "true"
    );

}


function loadDarkMode(){

    const dark =
        localStorage.getItem(
            "netsimulizi_dark"
        );

    if(dark === "true"){

        document.body.classList.add(
            "dark-mode"
        );

    }

}


/* STORY ID */

function getStoryId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        Number(
            params.get("id")
        );

    if(
        !Number.isInteger(id) ||
        id <= 0
    ){

        return null;

    }

    return id;

}


/* ESCAPE */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* NUMBER */

function number(value){

    return Number(
        value || 0
    ).toLocaleString();

}


/* LOAD STORY */

async function loadStory(){

    const storyId =
        getStoryId();

    const container =
        document.getElementById(
            "storyInfo"
        );


    if(!storyId){

        container.innerHTML = `

            <div class="error">

                Story ID haijapatikana.

                <br><br>

                <button
                    class="btn"
                    onclick="location.href='index.html'"
                >
                    Rudi Home
                </button>

            </div>

        `;

        return;

    }


    try{

        const response =
            await fetch(
                `${API}/stories/${storyId}`,
                {
                    headers:{
                        "Accept":
                            "application/json"
                    },
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success ||
            !data.story
        ){

            throw new Error(
                data.message ||
                "Hadithi haijapatikana."
            );

        }


        const story =
            data.story;


        const cover =
            story.cover_url
            ? `
                <img
                    src="${escapeHTML(
                        story.cover_url
                    )}"
                    alt="${escapeHTML(
                        story.title
                    )}"
                >
              `
            : `
                <span>
                    ${escapeHTML(
                        story.title ||
                        "Net Simulizi"
                    )}
                </span>
              `;


        container.innerHTML = `

            <a
                href="story.html?id=${storyId}"
                class="back"
            >
                ← Rudi kwenye hadithi
            </a>

            <div class="story-info">

                <div class="cover">

                    ${cover}

                </div>


                <div>

                    <span class="category">

                        ${escapeHTML(
                            story.category_name ||
                            story.category ||
                            "Story"
                        )}

                    </span>


                    <h1>

                        ${escapeHTML(
                            story.title ||
                            "Untitled Story"
                        )}

                    </h1>


                    <p class="author">

                        Na
                        <strong>

                            ${escapeHTML(
                                story.author_name ||
                                story.author ||
                                "Net Simulizi"
                            )}

                        </strong>

                    </p>


                    <p class="description">

                        ${escapeHTML(
                            story.description ||
                            "Hakuna maelezo ya hadithi kwa sasa."
                        )}

                    </p>


                    <div class="stats">

                        <span>
                            👁
                            ${number(
                                story.readers_count
                            )}
                            readers
                        </span>

                        <span>
                            🌐
                            ${escapeHTML(
                                story.language ||
                                "sw"
                            )}
                        </span>

                        <span>
                            📚
                            ${escapeHTML(
                                story.status ||
                                "published"
                            )}
                        </span>

                    </div>

                </div>

            </div>

        `;


    }catch(error){

        console.error(
            "Story error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                Imeshindikana kupakia hadithi.

                <br><br>

                <button
                    class="btn"
                    onclick="loadStory()"
                >
                    Jaribu Tena
                </button>

            </div>

        `;

    }

}


/* LOAD CHAPTERS */

async function loadChapters(){

    const storyId =
        getStoryId();

    const list =
        document.getElementById(
            "chapterList"
        );

    const count =
        document.getElementById(
            "chapterCount"
        );


    if(!storyId){

        list.innerHTML = `

            <div class="error">

                Story ID haijapatikana.

            </div>

        `;

        count.textContent =
            "0 chapters";

        return;

    }


    try{

        const response =
            await fetch(
                `${API}/stories/${storyId}/chapters`,
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json"
                    },
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        console.log(
            "Net Simulizi chapters:",
            data
        );


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Chapters hazikupatikana."
            );

        }


        const chapters =
            Array.isArray(
                data.chapters
            )
            ? data.chapters
            : [];


        count.textContent =
            chapters.length +
            (
                chapters.length === 1
                ? " chapter"
                : " chapters"
            );


        if(!chapters.length){

            list.innerHTML = `

                <div class="empty">

                    Bado hakuna chapters
                    zilizochapishwa kwa hadithi hii.

                </div>

            `;

            return;

        }


        const fragment =
            document.createDocumentFragment();


        chapters.forEach(
            function(chapter,index){

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "chapter";


                const chapterId =
                    chapter.id;


                const chapterNumber =
                    chapter.chapter_number ||
                    chapter.number ||
                    index + 1;


                const title =
                    chapter.title ||
                    `Chapter ${chapterNumber}`;


                const isPaid =
                    Boolean(
                        chapter.is_paid ||
                        chapter.paid ||
                        chapter.price > 0
                    );


                const price =
                    Number(
                        chapter.price || 0
                    );


                const left =
                    document.createElement(
                        "div"
                    );

                left.className =
                    "chapter-left";


                left.innerHTML = `

                    <div class="chapter-number">

                        ${escapeHTML(
                            chapterNumber
                        )}

                    </div>


                    <div>

                        <div class="chapter-title">

                            ${escapeHTML(
                                title
                            )}

                        </div>


                        <div class="chapter-meta">

                            ${
                                chapter.word_count
                                ? number(
                                    chapter.word_count
                                  ) +
                                  " words"
                                : "Chapter"
                            }

                        </div>

                    </div>

                `;


                const right =
                    document.createElement(
                        "div"
                    );

                right.className =
                    "chapter-right";


                if(isPaid){

                    right.innerHTML = `

                        <span class="paid">

                            🔒 Paid

                            ${
                                price
                                ? " · TSh " +
                                  number(price)
                                : ""
                            }

                        </span>

                        <button
                            class="locked"
                            onclick="openChapter(${Number(
                                chapterId || 0
                            )},true)"
                        >
                            Fungua
                        </button>

                    `;

                }else{

                    right.innerHTML = `

                        <span class="free">

                            FREE

                        </span>

                        <button
                            class="read-btn"
                            onclick="openChapter(${Number(
                                chapterId || 0
                            )},false)"
                        >
                            Soma
                        </button>

                    `;

                }


                item.appendChild(left);

                item.appendChild(right);

                fragment.appendChild(item);

            }
        );


        list.innerHTML = "";

        list.appendChild(
            fragment
        );


    }catch(error){

        console.error(
            "Chapters error:",
            error
        );


        count.textContent =
            "Error";


        list.innerHTML = `

            <div class="error">

                Imeshindikana kupakia chapters.

                <br><br>

                <button
                    class="btn primary"
                    onclick="loadChapters()"
                >
                    Jaribu Tena
                </button>

            </div>

        `;

    }

}


/* OPEN CHAPTER */

function openChapter(
    chapterId,
    paid
){

    if(!chapterId){

        alert(
            "Chapter haijatambuliwa."
        );

        return;

    }


    if(paid){

        const user =
            localStorage.getItem(
                "netsimulizi_user"
            );


        if(!user){

            alert(
                "Tafadhali ingia kwenye akaunti kwanza ili kufungua chapter hii."
            );

            location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;

        }


        /*
         * Payment integration itaongezwa
         * wakati mfumo wa malipo
         * utakapounganishwa.
         */

        alert(
            "Chapter hii ni ya malipo. Mfumo wa malipo utaunganishwa hatua inayofuata."
        );

        return;

    }


    location.href =
        "reader.html?chapter_id=" +
        encodeURIComponent(
            chapterId
        );

}


/* START */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadDarkMode();

        loadStory();

        loadChapters();

    }
);

</script>

</body>
</html>
